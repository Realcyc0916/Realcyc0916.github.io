  // 从 :root CSS 变量读取颜色，暗色模式下线条仍可见；取不到时回退到给定默认值
  function getCssColor(name, fallback) {

  function HeartCurve(w, h) {
    this.w = w;
    this.h = h;
    this.a = undefined;
    this.ctx = undefined;
    this.deg = 0;
    this.speed = 0.4;
    this.isPause = false;
    this.init();
  }
  HeartCurve.prototype.readColors = function () {
    this.axisColor = getCssColor('--c-text', '#999');
    this.circleColor = getCssColor('--c-text', '#000');
  };
  HeartCurve.prototype.init = function () {
    const {
      w,
      h
    } = this;
    const canvas = document.querySelector('#heart-curve');
    if (!canvas) throw Error('no canvas element!');

    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.ctx.translate(2 * w / 3, h / 2);
    this.ctx.lineJoin = 'round';
    this.a = w / 6.2;
    this.id = null;
    this.readColors();
    return this;
  };
  HeartCurve.prototype._drawAxis = function () {
    const {
      ctx,
      w,
      h
    } = this;
    ctx.lineWidth = 1;
    ctx.strokeStyle = this.axisColor;
    ctx.beginPath();
    ctx.moveTo(-w * 2 / 3, 0);
    ctx.lineTo(w / 3, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.48);
    ctx.lineTo(0, h * 0.48);
    ctx.stroke();
  };
  HeartCurve.prototype._drawCure = function () {
    const {
      ctx,
      a
    } = this;
    ctx.beginPath();
    let x, y, r, deg = 0;
    ctx.moveTo(0, 0);
    ctx.strokeStyle = "#ff0000";
    while (deg <= 360) {
      const theta = deg / 180 * Math.PI;
      r = 2 * a * (1 - Math.cos(theta));
      x = r * Math.cos(theta);
      y = r * Math.sin(theta);
      ctx.lineTo(x, y);
      deg++;
    }
    ctx.stroke();
  };
  HeartCurve.prototype.spin = function () {
    let {
      a,
      w,
      h,
      deg,
      ctx
    } = this;
    if (deg >= 360) deg = 0;

    ctx.clearRect(-w / 3 * 2, -h / 2, w, h);
    const theta = deg / 180 * Math.PI;
    this._drawAxis();
    ctx.lineWidth = 2;
    this._drawCure();
    ctx.strokeStyle = this.circleColor;
    ctx.fillStyle = this.circleColor;
    ctx.beginPath();
    ctx.arc(-a, 0, a, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(2 * a * Math.cos(theta) - a, 2 * a * Math.sin(theta), a, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.beginPath();

    let x = r * Math.cos(theta);
    let y = r * Math.sin(theta);
    ctx.arc(x, y, 3, 0, 2 * Math.PI);
    ctx.fill();

    this.deg = deg + this.speed;
    this.id = window.requestAnimationFrame(this.spin.bind(this));
  };

    this.isPause = true;
    if (window.cancelAnimationFrame) {
      window.cancelAnimationFrame(this.id);
    }
  };
  HeartCurve.prototype.resume = function () {
    if (!this.isPause) return;
    this.isPause = false;
    this.spin();
  };

    if (window.MutationObserver) {

    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (mq.matches && 'IntersectionObserver' in window) {

        entries.forEach(function (entry) {

      if (heartCurve.canvas) io.observe(heartCurve.canvas);

      var wallEl = document.querySelector('#wall-main');
      if (!wallEl) return;
      if (!media.matches && !hoverBound) {

        heartCurve.pause();
        wallEl.addEventListener('mouseenter', function () {
          heartCurve.resume();
        });
        wallEl.addEventListener('mouseleave', function () {
          heartCurve.pause();
        });
      }
    }
  })();
