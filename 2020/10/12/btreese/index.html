             currentNode=currentNode-&gt;right_node;<br>            }<br>        }<br>    }<br>}<br><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">Preorder</span><span class="hljs-params">(BTree bTree)</span>      <span class="hljs-comment">//递归前序遍历</span></span><br><span class="hljs-function"></span>{<br>    <span class="hljs-keyword">if</span>(bTree!=<span class="hljs-literal">NULL</span>)<br>    {<br>        cout&lt;&lt;bTree-&gt;value&lt;&lt;<span class="hljs-string">" "</span>;<br>        <span class="hljs-built_in">Preorder</span>(bTree-&gt;left_node);<br>        <span class="hljs-built_in">Preorder</span>(bTree-&gt;right_node);<br>    }<br>}<br><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">Preorder2</span><span class="hljs-params">(BTree bTree)</span>     <span class="hljs-comment">//非递归前序遍历</span></span><br><span class="hljs-function"></span>{<br>    <span class="hljs-comment">/*定义需要用到的变量*/</span><br>    BTree stack[ArraySize];     <span class="hljs-comment">//用数组来充当栈</span><br>    <span class="hljs-type">int</span> top=<span class="hljs-number">0</span>;      <span class="hljs-comment">//top变量来充当栈顶指针，top为0说明栈空</span><br>    BTree p=bTree;<br>    <span class="hljs-keyword">while</span>(p||top!=<span class="hljs-number">0</span>)<br>    {<br>        <span class="hljs-keyword">if</span>(p)<br>        {<br>            cout&lt;&lt;p-&gt;value&lt;&lt;<span class="hljs-string">" "</span>;<br>            stack[top++]=p;<br>            p=p-&gt;left_node;<br>        }<br>        <span class="hljs-keyword">else</span><br>        {<br>            p=stack[--top];     <span class="hljs-comment">//注意这里是“--top”</span><br>            p=p-&gt;right_node;<br>        }<br>    }<br>}<br><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">Inorder</span><span class="hljs-params">(BTree bTree)</span>       <span class="hljs-comment">//递归中序遍历</span></span><br><span class="hljs-function"></span>{<br>    <span class="hljs-keyword">if</span>(bTree!=<span class="hljs-literal">NULL</span>)<br>    {<br>        <span class="hljs-built_in">Inorder</span>(bTree-&gt;left_node);<br>        cout&lt;&lt;bTree-&gt;value&lt;&lt;<span class="hljs-string">" "</span>;<br>        <span class="hljs-built_in">Inorder</span>(bTree-&gt;right_node);<br>    }<br>}<br><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">Inorder2</span><span class="hljs-params">(BTree bTree)</span>      <span class="hljs-comment">//非递归中序遍历</span></span><br><span class="hljs-function"></span>{<br>    <span class="hljs-comment">/*定义需要用到的变量*/</span><br>    BTree stack[ArraySize];     <span class="hljs-comment">//用数组来充当栈</span><br>    <span class="hljs-type">int</span> top=<span class="hljs-number">0</span>;      <span class="hljs-comment">//top变量来充当栈顶指针，top为0说明栈空</span><br>    BTree p=bTree;<br>    <span class="hljs-keyword">while</span>(p||top!=<span class="hljs-number">0</span>)    <span class="hljs-comment">//举例：建立一个只有三个节点的二叉树发现，当p的指向为空，且top=0的时候，所有的元素都已经遍历过了</span><br>    {<br>        <span class="hljs-keyword">if</span>(p)<br>        {<br>            stack[top++]=p;<br>            p=p-&gt;left_node;<br>        }<br>        <span class="hljs-keyword">else</span>    <span class="hljs-comment">//举例发现，当p指向为空时，就要执行出战操作，然后输出元素</span><br>        {<br>            p=stack[--top];     <span class="hljs-comment">//注意这里是“--top”</span><br>            cout&lt;&lt;p-&gt;value&lt;&lt;<span class="hljs-string">" "</span>;<br>            p=p-&gt;right_node;<br>        }<br>    }<br>}<br><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">Postorder</span><span class="hljs-params">(BTree bTree)</span>     <span class="hljs-comment">//递归后序遍历</span></span><br><span class="hljs-function"></span>{<br>    <span class="hljs-keyword">if</span>(bTree!=<span class="hljs-literal">NULL</span>)<br>    {<br>        <span class="hljs-built_in">Postorder</span>(bTree-&gt;left_node);<br>        <span class="hljs-built_in">Postorder</span>(bTree-&gt;right_node);<br>        cout&lt;&lt;bTree-&gt;value&lt;&lt;<span class="hljs-string">" "</span>;<br>    }<br><br>}<br><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">Postorder2</span><span class="hljs-params">(BTree bTree)</span>        <span class="hljs-comment">//非递归后序遍历</span></span><br><span class="hljs-function"></span>{<br>    BTree stack1[ArraySize];<br>    <span class="hljs-type">int</span> stack2[ArraySize];<br>    <span class="hljs-type">int</span> top1=<span class="hljs-number">0</span>,top2=<span class="hljs-number">0</span>;<br>    <span class="hljs-type">int</span> flag;<br>    BTree p=bTree;<br>    <span class="hljs-keyword">while</span>(p||top1!=<span class="hljs-number">0</span>)<br>    {<br>        <span class="hljs-keyword">if</span>(p)<br>        {<br>            stack1[top1++]=p;<br>            stack2[top2++]=<span class="hljs-number">0</span>;<br>            p=p-&gt;left_node;<br>        }<br>        <span class="hljs-keyword">else</span><br>        {<br>            p=stack1[top1<span class="hljs-number">-1</span>];       <br>            flag=stack2[top2<span class="hljs-number">-1</span>];<br>            <span class="hljs-keyword">if</span>(flag==<span class="hljs-number">0</span>)<br>            {<br>                stack2[top2<span class="hljs-number">-1</span>]=<span class="hljs-number">1</span>;<br>                p=p-&gt;right_node;<br>            }<br>            <span class="hljs-keyword">else</span><br>            {<br>                p=stack1[--top1];<br>                --top2;<br>                cout&lt;&lt;p-&gt;value&lt;&lt;<span class="hljs-string">" "</span>;<br>                p=<span class="hljs-literal">NULL</span>;     <span class="hljs-comment">//这一句很关键，调试了一上午，问题就是没有加上这一句。</span><br>            }<br>        }<br>    }<br>}<br><br><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">main</span><span class="hljs-params">()</span></span><br><span class="hljs-function"></span>{<br>    <span class="hljs-type">int</span> content[ArraySize];<br>    cout&lt;&lt;<span class="hljs-string">"请输入6个整数："</span>&lt;&lt;endl; <span class="hljs-comment">//输入数据</span><br>    <span class="hljs-keyword">for</span>(<span class="hljs-type">int</span> i=<span class="hljs-number">0</span>;i&lt;ArraySize;i++)<br>        cin&gt;&gt;content[i];<br>    <span class="hljs-keyword">for</span>(<span class="hljs-type">int</span> i=<span class="hljs-number">0</span>;i&lt;ArraySize;i++)    <span class="hljs-comment">//建树</span><br>        <span class="hljs-built_in">Add_Node</span>(content[i]);<br>    cout&lt;&lt;<span class="hljs-string">"建树完成!"</span>&lt;&lt;endl;<br>    cout&lt;&lt;<span class="hljs-string">"递归前序遍历："</span>;<br>    <span class="hljs-built_in">Preorder</span>(bTree);<br>    cout&lt;&lt;<span class="hljs-string">"非递归前序遍历："</span>;<br>    <span class="hljs-built_in">Preorder2</span>(bTree);<br>    cout&lt;&lt;endl;<br><br>    cout&lt;&lt;<span class="hljs-string">"递归中序遍历："</span>;<br>    <span class="hljs-built_in">Inorder</span>(bTree);<br>    cout&lt;&lt;<span class="hljs-string">"非递归中序遍历："</span>;<br>    <span class="hljs-built_in">Inorder2</span>(bTree);<br>    cout&lt;&lt;endl;<br><br>    cout&lt;&lt;<span class="hljs-string">"递归后序遍历："</span>;<br>    <span class="hljs-built_in">Postorder</span>(bTree);<br>    cout&lt;&lt;<span class="hljs-string">"非递归后序遍历："</span>;<br>    <span class="hljs-built_in">Postorder2</span>(bTree);<br>    cout&lt;&lt;endl;<br>    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;<br>}<br></code></pre></td></tr></table></figure>
